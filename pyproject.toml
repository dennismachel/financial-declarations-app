[project]
name = "financial-declarations-agent"
version = "0.1.0"
description = "Forensic compliance agent for employee financial disclosures"
readme = "README.md"
authors = [{ name = "Dennis Humes" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
