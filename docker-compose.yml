services:
  db:
    image: pgvector/pgvector:pg16
    container_name: declarations-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-declarations_db}
      POSTGRES_USER: ${POSTGRES_USER:-compliance_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance_admin} -d ${POSTGRES_DB:-declarations_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .                  # Root context so builder accesses pyproject.toml & uv.lock
      dockerfile: backend/Dockerfile
    container_name: declarations-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance_admin}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-declarations_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PDF_STORAGE_PATH: /app/storage/pdfs
    volumes:
      - ./storage/pdfs:/app/storage/pdfs:ro
    ports:
      - "8000:8000"

volumes:
  pgdata: